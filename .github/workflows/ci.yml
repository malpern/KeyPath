name: KeyPath CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Hosted fallback for while the mini's runners are unavailable: set the repo
# variable KEYPATH_CI_RUNNER=hosted and both jobs run on GitHub's macOS 27 /
# Xcode 27 image (`xcode-27`) instead. Delete the variable to return to the
# mini. Job names, and so the required checks, are the same either way.
#   gh variable set KEYPATH_CI_RUNNER --repo malpern/KeyPath --body hosted
#   gh variable delete KEYPATH_CI_RUNNER --repo malpern/KeyPath
# Only ci.yml has the fallback. coverage, cache-warm and runner-health are
# mini-only jobs that do not gate PRs; they skip while this variable is set.

# GitHub counts a skipped check as passing, so the required checks must never be
# skipped. `build-and-test` and `code-quality` at the bottom of this file always run
# and always report a real result: they pass only if the matching full job succeeded,
# or the classifier succeeded and said docs-only. A cancelled run or a failed
# classifier can't pass them. Report these two names from this workflow only: a
# skipped job of the same name elsewhere satisfied branch protection before the real
# job had reported, which merged #1344 early.
jobs:
  classify-docs-only:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether all changed files are docs-only
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # master's copy of the script: a PR must not decide its own CI by changing it.
        run: |
          script=$(mktemp)
          if git show "$BASE_SHA:.github/scripts/classify-docs-only.sh" > "$script"; then
            result=$(bash "$script" "$BASE_SHA")
          else
            result="docs_only=false" # The base has no classifier yet; run everything.
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  test-full:
    needs: classify-docs-only
    if: ${{ (success() || failure()) && needs.classify-docs-only.outputs.docs_only != 'true' }}
    # macOS 27 AppSSO trapped SwiftPM binary-artifact requests from a headless
    # LaunchDaemon (docs: 2026-07-16-headless-swiftpm-appsso-trap.md). Since
    # 2026-10-19 the swiftpm-safe runner is a daemon too, because clawd has no GUI
    # session; the persistent scratch below means Sparkle is fetched only on a
    # cold scratch, not on every job.
    runs-on: ${{ fromJSON(vars.KEYPATH_CI_RUNNER == 'hosted' && '"xcode-27"' || '["self-hosted", "macOS", "keypath", "swiftpm-safe"]') }}
    # Warm runs normally finish in 2-3 minutes. A measured cold run spent about
    # 3 minutes on setup/Kanata and was still compiling Swift tests after another
    # 12 minutes, before test execution. Keep a finite bound with real headroom.
    # Every hosted run is cold, on a smaller machine. The mini's budget also
    # covers up to 10 minutes waiting for the test lock below.
    timeout-minutes: ${{ vars.KEYPATH_CI_RUNNER == 'hosted' && 60 || 35 }}
    # Two swift test runs must never overlap on the mini: they share unsandboxed
    # local state (e.g. RuleCollectionsManager's config file), which caused
    # spurious CLIPackCRUDTests failures. The runner label does that: only one
    # runner carries swiftpm-safe and it runs one job at a time, so test runs
    # from different PRs wait their turn. Do not add a job-level concurrency
    # group for this. A group holds one running and one pending job and cancels
    # the older pending one, so with three PRs in CI their jobs cancelled each
    # other (2026-11-14). The runner queue never cancels a waiting job.

    steps:
    - name: Clean stale git credentials
      run: |
        git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        git config --global --unset-all url.https://github.com/.insteadof 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false

    - name: Select Xcode 27.2 (hosted runner)
      # The image's default Xcode is 27.1. Xcode_27.2 is build 27B52, the one the
      # Macs use. KEYPATH_DEV_XCODE_DEVELOPER_DIR makes Scripts/lib/xcode.sh use
      # it instead of xcode-select, and DEVELOPER_DIR covers tools that ask
      # xcode-select. Never export SDKROOT here: with it set, SwiftPM's Metal step
      # reports "missing Metal Toolchain" (#1372). The cargo scripts take the SDK
      # from KEYPATH_SDKROOT.
      if: vars.KEYPATH_CI_RUNNER == 'hosted'
      run: |
        xcode=/Applications/Xcode_27.2.app/Contents/Developer
        build=$("$xcode/usr/bin/xcodebuild" -version | sed -n 's/^Build version //p' | head -1)
        if [[ "$build" != "27B52" ]]; then
          echo "::error::$xcode is Xcode build '$build', not 27B52; the image changed"
          exit 1
        fi
        echo "KEYPATH_DEV_XCODE_DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
        echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
        echo "KEYPATH_SDKROOT=$xcode/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" >> "$GITHUB_ENV"

    - name: Verify runner disk reserve
      env:
        # A hosted VM has far less disk than the mini. 12 GiB is a floor, not a
        # measurement of what a cold run uses; raise it once a hosted run has
        # shown the real number.
        KEYPATH_MIN_FREE_DISK_GIB: ${{ vars.KEYPATH_CI_RUNNER == 'hosted' && '12' || '40' }}
      run: ./Scripts/lab/host-disk-reserve

    - name: Ensure Metal toolchain
      run: ./Scripts/ensure-metal-toolchain.sh

    - name: Add Homebrew and Cargo to PATH
      run: |
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Compute kanata cache key
      id: kanata-cache-key
      run: |
        KANATA_SHA=$(git rev-parse HEAD:External/kanata)
        CARGO_LOCK_HASH=$(shasum -a 256 External/kanata/Cargo.lock | awk '{print $1}')
        RUSTC_HASH=$(rustc --version | shasum -a 256 | awk '{print $1}')
        echo "key=kanata-${{ runner.os }}-${{ runner.arch }}-${KANATA_SHA}-${CARGO_LOCK_HASH}-${RUSTC_HASH}" >> "$GITHUB_OUTPUT"
        echo "Kanata submodule: $KANATA_SHA"

    - name: Restore kanata binary cache
      id: kanata-cache
      uses: actions/cache@v4
      with:
        path: build/ci-kanata-cache
        key: ${{ steps.kanata-cache-key.outputs.key }}

    - name: Build and install kanata fork
      run: |
        mkdir -p build/ci-kanata-cache
        # On the self-hosted runner the workspace persists between runs, so
        # binaries from a previous run can survive even when actions/cache
        # missed. Gate the "hit" on a stamp matching the checked-out submodule
        # SHA — otherwise a stale-pin run poisons every later run with an old
        # engine (stale kanata-simulator broke RemapEndToEndTests; see #891).
        EXPECTED_ENGINE_SHA=$(git rev-parse HEAD:External/kanata)
        CACHED_ENGINE_SHA=$(cat build/ci-kanata-cache/engine-sha 2>/dev/null || echo "none")
        if [[ -x build/ci-kanata-cache/kanata && -x build/ci-kanata-cache/kanata-simulator && "$CACHED_ENGINE_SHA" == "$EXPECTED_ENGINE_SHA" ]]; then
          echo "✅ Restored kanata artifacts from cache (engine $CACHED_ENGINE_SHA)"
          echo "KANATA_CACHE_STATUS=hit" >> "$GITHUB_ENV"
        else
          echo "🔨 Building kanata artifacts (cache miss: cached=$CACHED_ENGINE_SHA expected=$EXPECTED_ENGINE_SHA)"
          cd External/kanata
          cargo build --release --target aarch64-apple-darwin 2>&1 | tail -20
          cargo build --release --target aarch64-apple-darwin -p kanata-sim 2>&1 | tail -20
          cd ../..
          cp External/kanata/target/aarch64-apple-darwin/release/kanata build/ci-kanata-cache/kanata
          cp External/kanata/target/aarch64-apple-darwin/release/kanata_simulated_input build/ci-kanata-cache/kanata-simulator
          chmod 755 build/ci-kanata-cache/kanata build/ci-kanata-cache/kanata-simulator
          echo "$EXPECTED_ENGINE_SHA" > build/ci-kanata-cache/engine-sha
          echo "KANATA_CACHE_STATUS=miss" >> "$GITHUB_ENV"
        fi
        cp build/ci-kanata-cache/kanata /opt/homebrew/bin/kanata
        cp build/ci-kanata-cache/kanata-simulator /opt/homebrew/bin/kanata-simulator
        kanata --version
        kanata-simulator --version

    - name: Rust tests (host bridge and engine control server)
      # ADR-046: the engine-control peer check, its owner tests and the session
      # command policy must run on every PR, not only build.
      run: |
        set -o pipefail
        (cd Rust/KeyPathKanataHostBridge && cargo test --features passthru-output-spike 2>&1 | tail -40)
        (cd External/kanata && cargo test --lib control_tests 2>&1 | tee "$RUNNER_TEMP/control-tests.log" | tail -20)
        # A renamed module must not turn this into a pass over zero tests.
        grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/control-tests.log"

    - name: Prepare persistent SwiftPM scratch
      # Persistent per runner on the mini: runner.workspace (_work/KeyPath)
      # survives between jobs, while runner.temp is wiped after every job and
      # made each build cold. One runner runs one job at a time, so jobs never
      # share this directory concurrently. A toolchain change or the size cap
      # clears build products but keeps what SwiftPM fetched, because fetching
      # Sparkle again from this headless daemon traps (see the script header).
      # A hosted VM starts empty every time, so there it is always cold.
      env:
        KEYPATH_SCRATCH_CAP_GIB: "30"
      run: ./Scripts/ci/swiftpm-scratch.sh prepare "${{ runner.workspace }}/swiftpm-scratch"

    - name: Run Test Lane - full
      env:
        KP_SIGN_DRY_RUN: "1"
        KEYPATH_BUNDLED_SIMULATOR_OVERRIDE: /opt/homebrew/bin/kanata-simulator
        # SwiftPM can wrap XCTest post-run SIGABRT as exit 1 on the self-hosted runner;
        # run-tests-safe.sh still fails if it parses any test failures and emits a warning when this path is used.
        # Not on hosted runners, where that quirk hasn't been seen.
        KEYPATH_ALLOW_TEST_RUNNER_CRASH_SUCCESS: ${{ vars.KEYPATH_CI_RUNNER == 'hosted' && '0' || '1' }}
        KEYPATH_TEST_ENFORCE_CLEAN_SUMMARY: "1"
        KEYPATH_TEST_RESET_MODULE_CACHE: "0"
        # The mini (M4 Pro, 14 cores) runs one test job at a time; leave a few
        # cores for quality-full on the other runner. Hosted VMs are smaller.
        KEYPATH_SWIFT_BUILD_JOBS: ${{ vars.KEYPATH_CI_RUNNER == 'hosted' && '4' || '10' }}
        # SCRATCH_PATH comes from "Prepare persistent SwiftPM scratch" via GITHUB_ENV.
      run: |
        echo "Running full named test lane..."
        export CI_ENVIRONMENT=true
        export SKIP_EVENT_TAP_TESTS=1
        export TIMEOUT_SECONDS=300
        chmod +x ./Scripts/test-lane.sh
        chmod +x ./Scripts/run-tests-safe.sh
        # Belt and braces for the runner label: if a second runner were ever
        # given swiftpm-safe, two test runs still must not overlap. This covers
        # the test command only, not the setup steps before it. lockf holds a
        # kernel lock that is released when the process exits, even if the job
        # is cancelled, so it cannot go stale.
        # The wait counts against this job's budget (35 minutes on the mini), so
        # give up well before it; lockf exits 75 when it does.
        rc=0
        /usr/bin/lockf -t 600 /tmp/keypath-ci-swift-tests.lock ./Scripts/test-lane.sh full || rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "TEST_STATUS=passed" >> $GITHUB_ENV
        else
          echo "TEST_STATUS=failed" >> $GITHUB_ENV
          if [ "$rc" -eq 75 ]; then
            echo "::error::Another test run held the mini's test lock for 10 minutes; tests did not run. Re-run this job."
          fi
          exit 1
        fi

    - name: String catalog matches the code
      # The test lane's Debug build wrote the compiler's .stringsdata files.
      run: ./Scripts/l10n/sync-strings.sh --check --build-dir "$SCRATCH_PATH"

    - name: Parse Installer Reliability Matrix from Test Log
      if: always()
      run: |
        echo "Parsing installer reliability matrix from test output..."
        chmod +x ./Scripts/parse-installer-matrix.sh
        ./Scripts/parse-installer-matrix.sh test_output.safe.txt

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test_output.safe.txt
          test-results/installer-reliability/
        if-no-files-found: ignore
        retention-days: 7

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY

        if [ "${TEST_STATUS:-unknown}" = "failed" ]; then
          echo "**Tests Failed** - Check the test-results artifact for details." >> $GITHUB_STEP_SUMMARY
        elif [ "${TEST_STATUS:-unknown}" = "passed" ]; then
          echo "**All Tests Passed**" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Test Status Unknown** (${TEST_STATUS:-unknown})" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Fast Smoke Lane" >> $GITHUB_STEP_SUMMARY
        if [ "${SMOKE_STATUS:-unknown}" = "failed" ]; then
          echo "- \`smoke\`: failed" >> $GITHUB_STEP_SUMMARY
        elif [ "${SMOKE_STATUS:-unknown}" = "passed" ]; then
          echo "- \`smoke\`: passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "- \`smoke\`: status unknown" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installer Reliability Matrix" >> $GITHUB_STEP_SUMMARY
        if [ -f "test-results/installer-reliability/latest/matrix-summary.md" ]; then
          cat test-results/installer-reliability/latest/matrix-summary.md >> $GITHUB_STEP_SUMMARY
        else
          echo "- Installer matrix summary not found." >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Kanata Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Cache status: \`${KANATA_CACHE_STATUS:-unknown}\`" >> $GITHUB_STEP_SUMMARY
        echo "- SwiftPM scratch: \`${SWIFTPM_SCRATCH_STATE:-unknown}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage" >> $GITHUB_STEP_SUMMARY
        echo "- Narrow coverage enforcement moved to the scheduled/manual \`KeyPath Coverage\` workflow." >> $GITHUB_STEP_SUMMARY

  quality-full:
    needs: classify-docs-only
    if: ${{ (success() || failure()) && needs.classify-docs-only.outputs.docs_only != 'true' }}
    runs-on: ${{ fromJSON(vars.KEYPATH_CI_RUNNER == 'hosted' && '"xcode-27"' || '["self-hosted", "macOS", "keypath"]') }}
    # Hosted runs also install mise and SwiftLint on a smaller machine.
    timeout-minutes: ${{ vars.KEYPATH_CI_RUNNER == 'hosted' && 30 || 15 }}
    # No test state is shared, so this runs on whichever mini runner is free,
    # alongside a test job. It lints only the changed files and takes under a
    # minute; the test job leaves it spare cores. No job-level concurrency group:
    # see the note on test-full.

    steps:
    - name: Clean stale git credentials
      run: |
        git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        git config --global --unset-all url.https://github.com/.insteadof 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Add Homebrew to PATH
      run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

    - name: Select Xcode 27.2 (hosted runner)
      # The image's default Xcode is 27.1. Xcode_27.2 is build 27B52, the one the
      # Macs use. KEYPATH_DEV_XCODE_DEVELOPER_DIR makes Scripts/lib/xcode.sh use
      # it instead of xcode-select, and DEVELOPER_DIR covers tools that ask
      # xcode-select. Never export SDKROOT here: with it set, SwiftPM's Metal step
      # reports "missing Metal Toolchain" (#1372). The cargo scripts take the SDK
      # from KEYPATH_SDKROOT.
      if: vars.KEYPATH_CI_RUNNER == 'hosted'
      run: |
        xcode=/Applications/Xcode_27.2.app/Contents/Developer
        build=$("$xcode/usr/bin/xcodebuild" -version | sed -n 's/^Build version //p' | head -1)
        if [[ "$build" != "27B52" ]]; then
          echo "::error::$xcode is Xcode build '$build', not 27B52; the image changed"
          exit 1
        fi
        echo "KEYPATH_DEV_XCODE_DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
        echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
        echo "KEYPATH_SDKROOT=$xcode/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" >> "$GITHUB_ENV"

    - name: Install mise and SwiftLint (hosted runner)
      # The mini has both; GitHub's image has neither. mise ignores a repo config
      # it hasn't been told to trust, which would skip the SwiftFormat pin.
      if: vars.KEYPATH_CI_RUNNER == 'hosted'
      run: |
        brew install mise swiftlint ripgrep
        mise trust mise.toml

    - name: Install pinned SwiftFormat
      run: mise install swiftformat

    - name: Get changed Swift files
      id: changed
      run: |
        BASE=${{ github.event.pull_request.base.sha }}
        CHANGED=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.swift' || true)
        if [ -z "$CHANGED" ]; then
          echo "swift_files=" >> $GITHUB_OUTPUT
          echo "No Swift files changed"
        else
          echo "swift_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed Swift files:"
          echo "$CHANGED"
        fi

    - name: SwiftLint Analysis
      if: steps.changed.outputs.swift_files != ''
      run: |
        echo "Linting changed Swift files only..."
        echo "${{ steps.changed.outputs.swift_files }}" | xargs swiftlint --reporter github-actions-logging
        echo "SWIFTLINT_STATUS=passed" >> $GITHUB_ENV

    - name: Verify SwiftFormat version matches pin
      if: steps.changed.outputs.swift_files != ''
      run: |
        PINNED=$(sed -nE 's/^[[:space:]]*swiftformat[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml)
        ACTUAL=$(mise exec swiftformat -- swiftformat --version | tr -d '[:space:]')
        echo "SwiftFormat — pinned (mise.toml): '$PINNED', installed: '$ACTUAL'"
        if [ -z "$PINNED" ]; then
          echo "::error::Could not read the swiftformat pin from mise.toml"
          exit 1
        fi
        if [ "$PINNED" != "$ACTUAL" ]; then
          echo "::error::SwiftFormat version drift — runner has '$ACTUAL' but mise.toml pins '$PINNED'."
          echo "::error::master is a formatted fixed-point for the pinned version; a different version produces spurious lint results. Install the pinned version on the runner (mise install / brew) or update mise.toml + reformat."
          exit 1
        fi

    - name: SwiftFormat Check
      if: steps.changed.outputs.swift_files != ''
      run: |
        echo "Checking formatting of changed Swift files (must match the pinned fixed-point)..."
        # SwiftFormat 0.61.1 can time out while applying rules across a large
        # argument set. Each file still uses the same pinned configuration;
        # batching one at a time keeps the lint result deterministic.
        echo "${{ steps.changed.outputs.swift_files }}" | xargs -n 1 mise exec swiftformat -- swiftformat --lint || {
          echo "::error::SwiftFormat found formatting issues. Run 'swiftformat Sources Tests' (at the pinned version) and commit."
          exit 1
        }

    - name: Wizard Sleep Lint
      run: |
        chmod +x ./Scripts/lint-no-sleep.sh
        ./Scripts/lint-no-sleep.sh

    - name: Accessibility Check
      run: |
        python3 Scripts/check-accessibility.py

    - name: Critical Pattern Analysis
      run: |
        if grep -r 'TODO.*CRITICAL\|FIXME.*URGENT' Sources/ --include='*.swift'; then
          echo "::error::CRITICAL TODO/FIXME markers found. Resolve them or downgrade the marker before merging."
          echo "CRITICAL_ISSUES=found" >> $GITHUB_ENV
          exit 1
        else
          echo "No critical TODOs/FIXMEs found"
          echo "CRITICAL_ISSUES=none" >> $GITHUB_ENV
        fi

    - name: Code Smell Detection
      run: |
        FORCE_UNWRAPS=0
        PRINT_STATEMENTS=0

        python3 - <<'PY' > /tmp/keypath-force-unwraps.txt
        from pathlib import Path
        import re

        pattern = re.compile(r"(?:\btry\s*!|(?:[\w\)\]\}\"'`])\s*!(?=\s*(?:[\)\]\}\.,;:]|$)))")
        for path in Path("Sources/KeyPathAppKit/Managers").rglob("*.swift"):
            try:
                lines = path.read_text(encoding="utf-8").splitlines()
            except UnicodeDecodeError:
                continue
            for idx, line in enumerate(lines, start=1):
                stripped = line.strip()
                if stripped.startswith("//") or "// swiftlint:disable" in line:
                    continue
                if pattern.search(line):
                    print(f"{path}:{idx}: {stripped}")
        PY
        if [ -s /tmp/keypath-force-unwraps.txt ]; then
          echo "::warning::Force unwraps found in manager files"
          head -10 /tmp/keypath-force-unwraps.txt
          FORCE_UNWRAPS=1
        fi

        if grep -r "print(" Sources/ --include="*.swift" | grep -v "// debug" >/dev/null 2>&1; then
          echo "::warning::print() statements found (consider using Logger)"
          grep -r "print(" Sources/ --include="*.swift" | grep -v "// debug" | head -10
          PRINT_STATEMENTS=1
        fi

        echo "FORCE_UNWRAPS=$FORCE_UNWRAPS" >> $GITHUB_ENV
        echo "PRINT_STATEMENTS=$PRINT_STATEMENTS" >> $GITHUB_ENV

    - name: Generate Code Quality Summary
      if: always()
      run: |
        echo "## Code Quality Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${SWIFTLINT_STATUS:-unknown}" = "passed" ]; then
          echo "- SwiftLint: **No violations**" >> $GITHUB_STEP_SUMMARY
        elif [ "${SWIFTLINT_STATUS:-unknown}" = "issues_found" ]; then
          echo "- SwiftLint: **Issues detected** - See job logs" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${CRITICAL_ISSUES:-unknown}" = "found" ]; then
          echo "- **CRITICAL issues found** - Review urgently" >> $GITHUB_STEP_SUMMARY
        fi

        SMELLS_FOUND=0
        if [ "${FORCE_UNWRAPS:-0}" = "1" ]; then
          echo "- Force unwraps found in manager files" >> $GITHUB_STEP_SUMMARY
          SMELLS_FOUND=1
        fi
        if [ "${PRINT_STATEMENTS:-0}" = "1" ]; then
          echo "- print() statements found (consider using Logger)" >> $GITHUB_STEP_SUMMARY
          SMELLS_FOUND=1
        fi
        if [ "$SMELLS_FOUND" = "0" ] && [ "${CRITICAL_ISSUES:-unknown}" = "none" ]; then
          echo "- No code smells detected" >> $GITHUB_STEP_SUMMARY
        fi

  # The required checks. See the note above `jobs:`.
  build-and-test:
    needs: [classify-docs-only, test-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the full job, unless the PR is docs-only
        env:
          CLASSIFIER: ${{ needs.classify-docs-only.result }}
          DOCS_ONLY: ${{ needs.classify-docs-only.outputs.docs_only }}
          FULL: ${{ needs.test-full.result }}
        run: |
          echo "classifier=$CLASSIFIER docs_only=$DOCS_ONLY full=$FULL"
          [[ "$FULL" == success ]] || [[ "$CLASSIFIER" == success && "$DOCS_ONLY" == true ]]

  code-quality:
    needs: [classify-docs-only, quality-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the full job, unless the PR is docs-only
        env:
          CLASSIFIER: ${{ needs.classify-docs-only.result }}
          DOCS_ONLY: ${{ needs.classify-docs-only.outputs.docs_only }}
          FULL: ${{ needs.quality-full.result }}
        run: |
          echo "classifier=$CLASSIFIER docs_only=$DOCS_ONLY full=$FULL"
          [[ "$FULL" == success ]] || [[ "$CLASSIFIER" == success && "$DOCS_ONLY" == true ]]
