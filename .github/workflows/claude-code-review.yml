name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Detect PR change scope
        id: changes
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files="$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}" HEAD)"

          if printf '%s\n' "$changed_files" | grep -qx '.github/workflows/claude-code-review.yml'; then
            echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_changed=false" >> "$GITHUB_OUTPUT"
          fi

          non_docs_files="$(printf '%s\n' "$changed_files" | awk '
            NF == 0 { next }
            /^docs\// { next }
            /^[^\/]+\.md$/ { next }
            /^\.github\/workflows\/claude-code-review\.yml$/ { next }
            { print }
          ')"

          if [ -z "$non_docs_files" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bounded review prompt
        id: review_prompt
        if: steps.changes.outputs.workflow_changed != 'true' && steps.changes.outputs.docs_only != 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          set -euo pipefail

          base_ref="origin/${{ github.base_ref }}"
          stat_file="$RUNNER_TEMP/pr.stat"
          diff_file="$RUNNER_TEMP/pr.diff"
          # This prompt is passed through action inputs/env before Claude runs.
          # Keep it well below the runner argv/env limit so broad refactors with
          # many import-only changes still get a review instead of failing to
          # start with "Argument list too long".
          max_diff_bytes=60000

          git diff --no-ext-diff --stat "$base_ref" HEAD > "$stat_file"
          git diff --no-ext-diff --find-renames --no-color "$base_ref" HEAD > "$diff_file"

          diff_bytes="$(wc -c < "$diff_file" | tr -d ' ')"

          {
            echo "prompt<<__CLAUDE_REVIEW_PROMPT__"
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo
            echo "Review only the supplied pull request diff below. Do not call repository"
            echo "inspection tools such as git, gh pr diff, rg, sed, cat, or ls; the diff"
            echo "context is already included here."
            echo
            echo "Report only BLOCKING findings: a defect in this diff that will cause wrong"
            echo "behavior, a crash, data loss, a security hole, or a failing build or test."
            echo "Do not report style, naming, documentation, missing-test wishes, or"
            echo "hypotheticals about configuration outside the diff. Do not repeat a point"
            echo "the code or a comment in the diff already addresses."
            echo
            echo "If you find blocking findings, use exactly one Bash tool call, gh pr comment,"
            echo "to leave one concise comment listing them, each with the file, the failure"
            echo "and the fix. If there are none, post nothing: a silent, passing check is"
            echo "the approval. Agents act on every comment, so a comment saying all is well"
            echo "costs a full review cycle."
            echo
            echo "Changed file summary:"
            cat "$stat_file"
            echo
            echo "Unified diff:"
            if [ "$diff_bytes" -gt "$max_diff_bytes" ]; then
              head -c "$max_diff_bytes" "$diff_file"
              echo
              echo "[Diff truncated after ${max_diff_bytes} bytes; review only the supplied portion and mention the truncation.]"
            else
              cat "$diff_file"
            fi
            echo "__CLAUDE_REVIEW_PROMPT__"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.changes.outputs.workflow_changed != 'true' && steps.changes.outputs.docs_only != 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'cursor'
          prompt: ${{ steps.review_prompt.outputs.prompt }}

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Leave room to post the assessment and finish the result turn. A
          # six-turn limit repeatedly aborted completed reviews with error_max_turns.
          claude_args: >-
            --max-turns 12
            --allowed-tools "Bash(gh pr comment:*)"

      - name: Skip Claude review for workflow-file changes
        if: steps.changes.outputs.workflow_changed == 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        # The review action will not run a workflow file the PR itself changed.
        # The check then passes only for PRs by the repository owner or Dependabot
        # (which bumps the action pins here); anyone else's fails. This is a
        # speed bump, not a boundary: the PR's own copy of this file runs, so it
        # can edit this step too. Branch protection and the owner's merge are the
        # boundary.
        run: |
          if [ "$AUTHOR" != "$OWNER" ] && [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "::error::This PR changes the Claude review workflow, which cannot review itself. The repository owner must review and merge it."
            exit 1
          fi
          echo "Skipping Claude review because .github/workflows/claude-code-review.yml changed in this PR."

      - name: Skip Claude review for Dependabot pin updates
        # Dependabot PRs get no repository secrets and the review action does not
        # run for that bot, so the review cannot run. The owner reviews the pin
        # change when merging.
        if: github.event.pull_request.user.login == 'dependabot[bot]' && steps.changes.outputs.workflow_changed != 'true'
        run: |
          echo "Skipping Claude review for a Dependabot action-pin update; the owner reviews it at merge."

      - name: Skip Claude review for docs-only changes
        if: steps.changes.outputs.workflow_changed != 'true' && steps.changes.outputs.docs_only == 'true'
        run: |
          echo "Skipping Claude review because this PR only changes docs or docs-adjacent assets."
