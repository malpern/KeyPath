name: TEMP probe hosted Xcode
on:
  push:
    branches: [ci/hosted-xcode-27-2]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          sw_vers; xcode-select -p
          for a in /Applications/Xcode*.app; do echo "$a: $($a/Contents/Developer/usr/bin/xcodebuild -version | tr '\n' ' ')"; done
