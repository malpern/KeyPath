:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;keypath-lab-state&quot;&gt;
  &lt;style&gt;
    #keypath-lab-state {
      --lab-bg:#090b0f;
      --lab-panel:#0e1117;
      --lab-panel-2:#121720;
      --lab-line:#29303c;
      --lab-text:#f1f4f8;
      --lab-muted:#7f8998;
      --lab-orange:#ff9650;
      --lab-cyan:#35c7df;
      --lab-green:#52df8b;
      --lab-purple:#a787ff;
      --lab-red:#ff6f75;
      min-height:100%;
      color:var(--lab-text);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    #keypath-lab-state * { box-sizing:border-box; }
    #keypath-lab-state .shell {
      overflow:hidden;
      border:1px solid #343b49;
      border-radius:18px;
      background:
        radial-gradient(circle at 78% -10%,rgba(53,199,223,.09),transparent 35%),
        linear-gradient(180deg,#0c0f14,var(--lab-bg));
      box-shadow:0 24px 70px rgba(0,0,0,.32);
    }
    #keypath-lab-state .top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:24px;
      padding:24px 26px 20px;
      border-bottom:1px solid var(--lab-line);
    }
    #keypath-lab-state .eyebrow {
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:9px;
      color:var(--lab-orange);
      font-size:11px;
      font-weight:700;
      letter-spacing:.13em;
      text-transform:uppercase;
    }
    #keypath-lab-state .eyebrow::before {
      content:&quot;&quot;;
      width:7px;
      height:7px;
      border:1px solid currentColor;
      border-radius:2px;
      transform:rotate(45deg);
      box-shadow:0 0 12px currentColor;
    }
    #keypath-lab-state h1 {
      margin:0;
      font:600 clamp(25px,3vw,38px)/1.05 system-ui,sans-serif;
      letter-spacing:-.035em;
    }
    #keypath-lab-state .subtitle {
      max-width:720px;
      margin-top:8px;
      color:var(--lab-muted);
      font:13px/1.5 system-ui,sans-serif;
    }
    #keypath-lab-state .host-state {
      display:flex;
      align-items:center;
      gap:9px;
      min-width:max-content;
      padding:9px 12px;
      border:1px solid var(--lab-line);
      border-radius:999px;
      color:var(--lab-muted);
      background:rgba(255,255,255,.025);
      font-size:11px;
    }
    #keypath-lab-state .host-state i,
    #keypath-lab-state .status-dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--lab-muted);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--lab-muted) 15%,transparent);
    }
    #keypath-lab-state .host-state[data-state=&quot;online&quot;] i { background:var(--lab-green); box-shadow:0 0 12px var(--lab-green); }
    #keypath-lab-state .host-state[data-state=&quot;offline&quot;] i { background:var(--lab-red); box-shadow:0 0 12px var(--lab-red); }
    #keypath-lab-state .workspace {
      display:grid;
      grid-template-columns:minmax(0,1.6fr) minmax(270px,.7fr);
      min-height:540px;
    }
    #keypath-lab-state main { min-width:0; padding:22px 24px 26px; }
    #keypath-lab-state aside { min-width:0; border-left:1px solid var(--lab-line); background:rgba(255,255,255,.018); }
    #keypath-lab-state .run-head {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:24px;
      align-items:end;
    }
    #keypath-lab-state .run-kicker {
      color:var(--lab-muted);
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    #keypath-lab-state .run-title {
      margin-top:5px;
      overflow:hidden;
      color:var(--lab-text);
      font:500 20px/1.25 system-ui,sans-serif;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    #keypath-lab-state .run-meta {
      display:flex;
      align-items:baseline;
      gap:10px;
    }
    #keypath-lab-state .elapsed { font-size:27px; letter-spacing:-.04em; }
    #keypath-lab-state .run-status { color:var(--lab-muted); font-size:11px; text-transform:uppercase; }
    #keypath-lab-state .notice {
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      margin:18px 0 20px;
      padding:12px 14px;
      border:1px solid color-mix(in srgb,var(--lab-cyan) 45%,var(--lab-line));
      border-radius:10px;
      background:color-mix(in srgb,var(--lab-cyan) 8%,transparent);
    }
    #keypath-lab-state .notice[data-tone=&quot;human&quot;] { border-color:color-mix(in srgb,var(--lab-purple) 55%,var(--lab-line)); background:color-mix(in srgb,var(--lab-purple) 10%,transparent); }
    #keypath-lab-state .notice[data-tone=&quot;problem&quot;] { border-color:color-mix(in srgb,var(--lab-red) 55%,var(--lab-line)); background:color-mix(in srgb,var(--lab-red) 9%,transparent); }
    #keypath-lab-state .notice-mark {
      width:10px;
      height:10px;
      border:2px solid var(--lab-cyan);
      border-radius:50%;
      box-shadow:0 0 14px var(--lab-cyan);
    }
    #keypath-lab-state .notice[data-tone=&quot;human&quot;] .notice-mark { border-color:var(--lab-purple); box-shadow:0 0 14px var(--lab-purple); }
    #keypath-lab-state .notice[data-tone=&quot;problem&quot;] .notice-mark { border-color:var(--lab-red); box-shadow:0 0 14px var(--lab-red); }
    #keypath-lab-state .notice strong { display:block; font:600 12px system-ui,sans-serif; }
    #keypath-lab-state .notice span { display:block; margin-top:2px; color:var(--lab-muted); font:11px/1.4 system-ui,sans-serif; }
    #keypath-lab-state .owner {
      padding:4px 7px;
      border:1px solid var(--lab-line);
      border-radius:999px;
      color:var(--lab-muted);
      font-size:9px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    #keypath-lab-state .section-label {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:17px 0 9px;
      color:var(--lab-muted);
      font-size:10px;
      letter-spacing:.11em;
      text-transform:uppercase;
    }
    #keypath-lab-state .pipeline {
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:8px;
    }
    #keypath-lab-state .stage {
      position:relative;
      min-height:72px;
      overflow:hidden;
      padding:10px;
      border:1px solid var(--lab-line);
      border-radius:8px;
      background:var(--lab-panel);
    }
    #keypath-lab-state .stage::before {
      content:&quot;&quot;;
      display:block;
      width:7px;
      height:7px;
      margin-bottom:13px;
      border-radius:2px;
      background:#3a414e;
    }
    #keypath-lab-state .stage strong {
      display:block;
      overflow:hidden;
      font-size:10px;
      font-weight:600;
      line-height:1.3;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    #keypath-lab-state .stage span { display:block; margin-top:4px; color:var(--lab-muted); font-size:9px; }
    #keypath-lab-state .stage[data-status=&quot;passed&quot;] { border-color:color-mix(in srgb,var(--lab-green) 38%,var(--lab-line)); }
    #keypath-lab-state .stage[data-status=&quot;passed&quot;]::before { background:var(--lab-green); box-shadow:0 0 12px var(--lab-green); }
    #keypath-lab-state .stage[data-status=&quot;active&quot;] { border-color:var(--lab-purple); background:color-mix(in srgb,var(--lab-purple) 12%,var(--lab-panel)); }
    #keypath-lab-state .stage[data-status=&quot;active&quot;]::before { background:var(--lab-purple); box-shadow:0 0 12px var(--lab-purple); }
    #keypath-lab-state .stage[data-status=&quot;active&quot;]::after {
      content:&quot;&quot;;
      position:absolute;
      left:-30%;
      bottom:0;
      width:36%;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--lab-purple),transparent);
      animation:lab-scan 1.8s linear infinite;
    }
    #keypath-lab-state .stage[data-status=&quot;waiting&quot;] { border-color:color-mix(in srgb,var(--lab-orange) 55%,var(--lab-line)); }
    #keypath-lab-state .stage[data-status=&quot;waiting&quot;]::before { background:var(--lab-orange); box-shadow:0 0 12px var(--lab-orange); }
    #keypath-lab-state .stage[data-status=&quot;failed&quot;] { border-color:var(--lab-red); }
    #keypath-lab-state .stage[data-status=&quot;failed&quot;]::before { background:var(--lab-red); box-shadow:0 0 12px var(--lab-red); }
    @keyframes lab-scan { to { left:110%; } }
    #keypath-lab-state .resource-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    #keypath-lab-state .resource {
      min-width:0;
      padding:12px;
      border:1px solid var(--lab-line);
      border-radius:9px;
      background:var(--lab-panel-2);
    }
    #keypath-lab-state .resource-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #keypath-lab-state .resource-kind { color:var(--lab-muted); font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
    #keypath-lab-state .resource-name { margin-top:8px; overflow:hidden; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    #keypath-lab-state .resource-detail { margin-top:5px; color:var(--lab-muted); font:10px/1.35 system-ui,sans-serif; }
    #keypath-lab-state .resource[data-state=&quot;ready&quot;] .status-dot,
    #keypath-lab-state .resource[data-state=&quot;running&quot;] .status-dot { background:var(--lab-green); box-shadow:0 0 10px var(--lab-green); }
    #keypath-lab-state .resource[data-state=&quot;booting&quot;] .status-dot,
    #keypath-lab-state .resource[data-state=&quot;creating&quot;] .status-dot { background:var(--lab-purple); box-shadow:0 0 10px var(--lab-purple); animation:lab-breathe 1.5s ease-in-out infinite; }
    #keypath-lab-state .resource[data-state=&quot;waiting&quot;] .status-dot { background:var(--lab-orange); box-shadow:0 0 10px var(--lab-orange); }
    #keypath-lab-state .resource[data-state=&quot;failed&quot;] .status-dot { background:var(--lab-red); box-shadow:0 0 10px var(--lab-red); }
    @keyframes lab-breathe { 50% { opacity:.35; transform:scale(.75); } }
    #keypath-lab-state .metrics {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      border-top:1px solid var(--lab-line);
      border-bottom:1px solid var(--lab-line);
    }
    #keypath-lab-state .metric { padding:15px 14px; border-right:1px solid var(--lab-line); }
    #keypath-lab-state .metric:last-child { border-right:0; }
    #keypath-lab-state .metric strong { display:block; font-size:19px; font-weight:500; }
    #keypath-lab-state .metric span { display:block; margin-top:3px; color:var(--lab-muted); font:9px system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    #keypath-lab-state .event-head { padding:16px 15px 9px; }
    #keypath-lab-state .event-head strong { display:block; font:600 13px system-ui,sans-serif; }
    #keypath-lab-state .event-head span { color:var(--lab-muted); font:10px system-ui,sans-serif; }
    #keypath-lab-state .events { max-height:470px; overflow:auto; padding:0 15px 18px; }
    #keypath-lab-state .event {
      display:grid;
      grid-template-columns:8px minmax(0,1fr) auto;
      gap:9px;
      padding:10px 0;
      border-top:1px solid var(--lab-line);
    }
    #keypath-lab-state .event .status-dot { width:7px; height:7px; margin-top:4px; }
    #keypath-lab-state .event[data-tone=&quot;working&quot;] .status-dot { background:var(--lab-purple); box-shadow:0 0 8px var(--lab-purple); }
    #keypath-lab-state .event[data-tone=&quot;success&quot;] .status-dot { background:var(--lab-green); box-shadow:0 0 8px var(--lab-green); }
    #keypath-lab-state .event[data-tone=&quot;waiting&quot;] .status-dot { background:var(--lab-orange); box-shadow:0 0 8px var(--lab-orange); }
    #keypath-lab-state .event[data-tone=&quot;problem&quot;] .status-dot { background:var(--lab-red); box-shadow:0 0 8px var(--lab-red); }
    #keypath-lab-state .event strong { display:block; font:500 10px/1.35 system-ui,sans-serif; }
    #keypath-lab-state .event p { margin:3px 0 0; color:var(--lab-muted); font:10px/1.35 system-ui,sans-serif; }
    #keypath-lab-state .event time { color:var(--lab-muted); font-size:9px; }
    #keypath-lab-state .empty { padding:12px; border:1px dashed var(--lab-line); border-radius:8px; color:var(--lab-muted); font:11px/1.4 system-ui,sans-serif; }
    #keypath-lab-state .footer {
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:12px 20px;
      border-top:1px solid var(--lab-line);
      color:var(--lab-muted);
      font:9px/1.4 system-ui,sans-serif;
    }
    @media(prefers-reduced-motion:reduce) {
      #keypath-lab-state .stage[data-status=&quot;active&quot;]::after,
      #keypath-lab-state .resource .status-dot { animation:none; }
    }
    @media(max-width:900px) {
      #keypath-lab-state .workspace { grid-template-columns:1fr; }
      #keypath-lab-state aside { border-top:1px solid var(--lab-line); border-left:0; }
      #keypath-lab-state .pipeline { grid-template-columns:repeat(4,minmax(0,1fr)); }
    }
    @media(max-width:620px) {
      #keypath-lab-state .top,#keypath-lab-state .run-head { grid-template-columns:1fr; display:grid; }
      #keypath-lab-state .host-state { justify-self:start; }
      #keypath-lab-state .pipeline { grid-template-columns:repeat(2,minmax(0,1fr)); }
      #keypath-lab-state .resource-grid { grid-template-columns:1fr; }
      #keypath-lab-state .notice { grid-template-columns:auto minmax(0,1fr); }
      #keypath-lab-state .owner { display:none; }
    }
  &lt;/style&gt;

  &lt;section class=&quot;shell&quot;&gt;
    &lt;header class=&quot;top&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;eyebrow&quot;&gt;KeyPath · live lab&lt;/div&gt;
        &lt;h1&gt;What the lab is doing now&lt;/h1&gt;
        &lt;div class=&quot;subtitle&quot;&gt;A live operating view of host readiness, disposable VMs, test stages, human handoffs, evidence, and cleanup.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;host-state&quot; id=&quot;lab-host-state&quot; data-state=&quot;unknown&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;span&gt;Connecting to mini…&lt;/span&gt;&lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;workspace&quot;&gt;
      &lt;main&gt;
        &lt;div class=&quot;run-head&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;run-kicker&quot;&gt;Current run&lt;/div&gt;&lt;div class=&quot;run-title&quot; id=&quot;lab-run-title&quot;&gt;Waiting for lab state…&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;run-meta&quot;&gt;&lt;strong class=&quot;elapsed&quot; id=&quot;lab-elapsed&quot;&gt;—&lt;/strong&gt;&lt;span class=&quot;run-status&quot; id=&quot;lab-run-status&quot;&gt;idle&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;section class=&quot;notice&quot; id=&quot;lab-notice&quot; data-tone=&quot;system&quot; aria-live=&quot;polite&quot;&gt;
          &lt;i class=&quot;notice-mark&quot;&gt;&lt;/i&gt;
          &lt;div&gt;&lt;strong id=&quot;lab-notice-title&quot;&gt;Connecting to the lab&lt;/strong&gt;&lt;span id=&quot;lab-notice-detail&quot;&gt;Reading the mini, leases, and active run.&lt;/span&gt;&lt;/div&gt;
          &lt;span class=&quot;owner&quot; id=&quot;lab-notice-owner&quot;&gt;system&lt;/span&gt;
        &lt;/section&gt;

        &lt;div class=&quot;section-label&quot;&gt;&lt;span&gt;Run pipeline&lt;/span&gt;&lt;span id=&quot;lab-stage-summary&quot;&gt;0 / 0 complete&lt;/span&gt;&lt;/div&gt;
        &lt;section class=&quot;pipeline&quot; id=&quot;lab-pipeline&quot; aria-label=&quot;Current lab run stages&quot;&gt;&lt;/section&gt;

        &lt;div class=&quot;section-label&quot;&gt;&lt;span&gt;Resources in the lab&lt;/span&gt;&lt;span id=&quot;lab-resource-summary&quot;&gt;No active resources&lt;/span&gt;&lt;/div&gt;
        &lt;section class=&quot;resource-grid&quot; id=&quot;lab-resources&quot; aria-label=&quot;Lab resources&quot;&gt;&lt;/section&gt;
      &lt;/main&gt;

      &lt;aside&gt;
        &lt;section class=&quot;metrics&quot; aria-label=&quot;Lab summary&quot;&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;lab-vm-count&quot;&gt;0&lt;/strong&gt;&lt;span&gt;VM resources&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;lab-lease-count&quot;&gt;0&lt;/strong&gt;&lt;span&gt;Open leases&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;metric&quot;&gt;&lt;strong id=&quot;lab-disk&quot;&gt;—&lt;/strong&gt;&lt;span&gt;Disk free&lt;/span&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;div class=&quot;event-head&quot;&gt;&lt;strong&gt;Live event stream&lt;/strong&gt;&lt;span&gt;Meaningful transitions, newest first&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;events&quot; id=&quot;lab-events&quot;&gt;&lt;/div&gt;
      &lt;/aside&gt;
    &lt;/div&gt;

    &lt;footer class=&quot;footer&quot;&gt;
      &lt;span id=&quot;lab-updated&quot;&gt;Waiting for first snapshot…&lt;/span&gt;
      &lt;span&gt;Dashboard state is routing; lease manifests and captured evidence remain authoritative.&lt;/span&gt;
    &lt;/footer&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;keypath-lab-state&#x27;);
      const stateURL = new URL(&#x27;keypath-lab-state.json&#x27;, window.parent.location.href).href;
      const defaultStages = [
        [&#x27;source&#x27;,&#x27;Prepare source&#x27;],
        [&#x27;build&#x27;,&#x27;Build&#x27;],
        [&#x27;sign&#x27;,&#x27;Sign&#x27;],
        [&#x27;deploy&#x27;,&#x27;Deploy&#x27;],
        [&#x27;host&#x27;,&#x27;Host ready&#x27;],
        [&#x27;accessory&#x27;,&#x27;USB listener&#x27;],
        [&#x27;assign&#x27;,&#x27;Assign keyboard&#x27;],
        [&#x27;clone&#x27;,&#x27;Clone VM&#x27;],
        [&#x27;boot&#x27;,&#x27;Boot + network&#x27;],
        [&#x27;test&#x27;,&#x27;Run test&#x27;],
        [&#x27;evidence&#x27;,&#x27;Capture evidence&#x27;],
        [&#x27;cleanup&#x27;,&#x27;Cleanup&#x27;]
      ];
      let latestState;
      const text = (selector,value) =&gt; { root.querySelector(selector).textContent=value; };
      const statusLabel = value =&gt; ({idle:&#x27;idle&#x27;,active:&#x27;running&#x27;,waiting:&#x27;waiting&#x27;,passed:&#x27;complete&#x27;,failed:&#x27;failed&#x27;}[value] || value || &#x27;unknown&#x27;);
      const shortTime = value =&gt; value ? new Date(value).toLocaleTimeString([],{hour:&#x27;numeric&#x27;,minute:&#x27;2-digit&#x27;,second:&#x27;2-digit&#x27;}) : &#x27;—&#x27;;
      const duration = (start,end) =&gt; {
        if(!start) return &#x27;—&#x27;;
        const seconds=Math.max(0,Math.floor(((end ? new Date(end) : new Date())-new Date(start))/1000));
        if(seconds&lt;60) return `${seconds}s`;
        const minutes=Math.floor(seconds/60);
        return minutes&lt;60 ? `${minutes}m ${String(seconds%60).padStart(2,&#x27;0&#x27;)}s` : `${Math.floor(minutes/60)}h ${String(minutes%60).padStart(2,&#x27;0&#x27;)}m`;
      };
      const stageDuration = stage =&gt; stage.startedAt ? duration(stage.startedAt,stage.finishedAt) : statusLabel(stage.status);
      const renderStages = run =&gt; {
        const actual=new Map((run.stages||[]).map(stage=&gt;[stage.id,stage]));
        const ordered=[];
        defaultStages.forEach(([id,label])=&gt;ordered.push(actual.get(id)||{id,label,status:&#x27;queued&#x27;}));
        (run.stages||[]).forEach(stage=&gt;{ if(!defaultStages.some(([id])=&gt;id===stage.id)) ordered.push(stage); });
        const nodes=ordered.map(stage=&gt;{
          const node=document.createElement(&#x27;article&#x27;);
          node.className=&#x27;stage&#x27;; node.dataset.status=stage.status||&#x27;queued&#x27;;
          const mark=document.createElement(&#x27;i&#x27;);
          const label=document.createElement(&#x27;strong&#x27;); label.textContent=stage.label||stage.id;
          const meta=document.createElement(&#x27;span&#x27;); meta.textContent=stageDuration(stage);
          node.append(mark,label,meta);
          node.title=stage.detail||stage.label||stage.id;
          return node;
        });
        root.querySelector(&#x27;#lab-pipeline&#x27;).replaceChildren(...nodes);
        const passed=ordered.filter(stage=&gt;stage.status===&#x27;passed&#x27;||stage.status===&#x27;skipped&#x27;).length;
        text(&#x27;#lab-stage-summary&#x27;,`${passed} / ${ordered.length} complete`);
      };
      const resourceNode = resource =&gt; {
        const node=document.createElement(&#x27;article&#x27;);
        node.className=&#x27;resource&#x27;; node.dataset.state=resource.state||&#x27;unknown&#x27;;
        const top=document.createElement(&#x27;div&#x27;); top.className=&#x27;resource-top&#x27;;
        const kind=document.createElement(&#x27;span&#x27;); kind.className=&#x27;resource-kind&#x27;; kind.textContent=resource.kind||&#x27;resource&#x27;;
        const dot=document.createElement(&#x27;i&#x27;); dot.className=&#x27;status-dot&#x27;; top.append(kind,dot);
        const name=document.createElement(&#x27;div&#x27;); name.className=&#x27;resource-name&#x27;; name.textContent=resource.id||&#x27;unknown&#x27;;
        const detail=document.createElement(&#x27;div&#x27;); detail.className=&#x27;resource-detail&#x27;; detail.textContent=resource.detail||statusLabel(resource.state);
        node.append(top,name,detail); return node;
      };
      const renderResources = state =&gt; {
        const host=state.host||{};
        const resources=[
          {kind:&#x27;host&#x27;,id:host.name||&#x27;KeyPath lab mini&#x27;,state:host.connectivity===&#x27;online&#x27;?(host.console===&#x27;locked&#x27;?&#x27;waiting&#x27;:&#x27;ready&#x27;):&#x27;failed&#x27;,detail:`${host.osVersion||&#x27;macOS ?&#x27;} ${host.osBuild||&#x27;&#x27;} · ${host.console||&#x27;console ?&#x27;} · ${host.power||&#x27;power ?&#x27;}`},
          {kind:&#x27;usb&#x27;,id:host.keyboard?.name||&#x27;USB keyboard&#x27;,state:host.keyboard?.state===&#x27;connected-to-host&#x27;?&#x27;ready&#x27;:&#x27;waiting&#x27;,detail:host.keyboard?.state||&#x27;unknown&#x27;},
          ...(state.resources||[])
        ];
        root.querySelector(&#x27;#lab-resources&#x27;).replaceChildren(...resources.map(resourceNode));
        const vmCount=(state.resources||[]).filter(item=&gt;item.kind===&#x27;vm&#x27;&amp;&amp;![&#x27;destroyed&#x27;,&#x27;stopped&#x27;].includes(item.state)).length;
        text(&#x27;#lab-vm-count&#x27;,String(vmCount));
        text(&#x27;#lab-lease-count&#x27;,String((state.leases||[]).length));
        text(&#x27;#lab-disk&#x27;,host.diskFreeGiB==null?&#x27;—&#x27;:`${host.diskFreeGiB}G`);
        text(&#x27;#lab-resource-summary&#x27;,`${vmCount} VM${vmCount===1?&#x27;&#x27;:&#x27;s&#x27;} · ${(state.leases||[]).length} lease${(state.leases||[]).length===1?&#x27;&#x27;:&#x27;s&#x27;}`);
      };
      const renderEvents = state =&gt; {
        const events=state.events||[];
        if(!events.length) {
          const empty=document.createElement(&#x27;div&#x27;); empty.className=&#x27;empty&#x27;; empty.textContent=&#x27;No structured run events yet. Host and resource snapshots will continue updating.&#x27;;
          root.querySelector(&#x27;#lab-events&#x27;).replaceChildren(empty); return;
        }
        const nodes=events.slice(0,30).map(event=&gt;{
          const row=document.createElement(&#x27;article&#x27;); row.className=&#x27;event&#x27;; row.dataset.tone=event.tone||&#x27;neutral&#x27;;
          const dot=document.createElement(&#x27;i&#x27;); dot.className=&#x27;status-dot&#x27;;
          const body=document.createElement(&#x27;div&#x27;); const title=document.createElement(&#x27;strong&#x27;); title.textContent=event.title||event.stage||&#x27;Lab event&#x27;;
          const detail=document.createElement(&#x27;p&#x27;); detail.textContent=event.detail||&#x27;&#x27;; body.append(title,detail);
          const time=document.createElement(&#x27;time&#x27;); time.textContent=shortTime(event.time); row.append(dot,body,time); return row;
        });
        root.querySelector(&#x27;#lab-events&#x27;).replaceChildren(...nodes);
      };
      const renderNotice = state =&gt; {
        const host=state.host||{}; const run=state.run||{};
        let tone=&#x27;system&#x27;,owner=&#x27;system&#x27;,title=&#x27;Lab is ready&#x27;,detail=run.nextAction||&#x27;Waiting for the next command.&#x27;;
        if(host.connectivity!==&#x27;online&#x27;) {
          tone=&#x27;problem&#x27;; title=&#x27;The lab mini is offline&#x27;; detail=&#x27;Reconnect the host before starting or trusting a VM run.&#x27;;
        } else if(host.console===&#x27;locked&#x27;) {
          tone=&#x27;human&#x27;; owner=&#x27;Micah&#x27;; title=&#x27;The lab mini is locked&#x27;; detail=&#x27;Unlock the clawd desktop before a test that needs macOS UI or Accessory Access.&#x27;;
        } else if(run.requiresHuman) {
          tone=&#x27;human&#x27;; owner=&#x27;Micah&#x27;; title=&#x27;Waiting for your action&#x27;; detail=run.nextAction||&#x27;Complete the visible lab handoff.&#x27;;
        } else if(run.status===&#x27;failed&#x27;) {
          tone=&#x27;problem&#x27;; owner=&#x27;agent&#x27;; title=&#x27;Run stopped at a failed stage&#x27;; detail=run.nextAction||&#x27;Inspect the latest event and clean up the disposable resource.&#x27;;
        } else if(run.status===&#x27;active&#x27;) {
          owner=&#x27;agent&#x27;; title=&#x27;Automation is moving&#x27;; detail=run.nextAction||&#x27;The next stage will begin automatically.&#x27;;
        } else if(run.status===&#x27;passed&#x27;) {
          title=&#x27;Run complete&#x27;; detail=run.nextAction||&#x27;Evidence is ready and cleanup is complete.&#x27;;
        }
        const notice=root.querySelector(&#x27;#lab-notice&#x27;); notice.dataset.tone=tone;
        text(&#x27;#lab-notice-title&#x27;,title); text(&#x27;#lab-notice-detail&#x27;,detail); text(&#x27;#lab-notice-owner&#x27;,owner);
      };
      const render = state =&gt; {
        latestState=state;
        const host=state.host||{}; const run=state.run||{};
        const hostState=root.querySelector(&#x27;#lab-host-state&#x27;); hostState.dataset.state=host.connectivity||&#x27;unknown&#x27;;
        hostState.querySelector(&#x27;span&#x27;).textContent=`${host.connectivity||&#x27;unknown&#x27;} · ${host.console||&#x27;console ?&#x27;} · ${host.power||&#x27;power ?&#x27;}`;
        text(&#x27;#lab-run-title&#x27;,run.title||&#x27;No active lab run&#x27;);
        text(&#x27;#lab-run-status&#x27;,statusLabel(run.status));
        text(&#x27;#lab-elapsed&#x27;,duration(run.startedAt,run.finishedAt));
        text(&#x27;#lab-updated&#x27;,`Snapshot ${shortTime(state.updatedAt)} · refreshes every 5 seconds`);
        renderNotice(state); renderStages(run); renderResources(state); renderEvents(state);
      };
      const refresh = async () =&gt; {
        try {
          const response=await fetch(`${stateURL}?t=${Date.now()}`,{cache:&#x27;no-store&#x27;});
          if(!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch(error) {
          render({...latestState,host:{...(latestState?.host||{}),connectivity:&#x27;offline&#x27;},updatedAt:new Date().toISOString()});
        }
      };
      refresh(); setInterval(refresh,5000);
      setInterval(()=&gt;{ if(latestState) text(&#x27;#lab-elapsed&#x27;,duration(latestState.run?.startedAt,latestState.run?.finishedAt)); },1000);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
