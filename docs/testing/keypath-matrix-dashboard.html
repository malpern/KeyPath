:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;keypath-matrix&quot;&gt;
  &lt;style&gt;
    #keypath-matrix {
      --ink:#f5f7fb; --dim:#9299a9; --faint:#626a7d; --line:#292e3a; --panel:#11141a;
      --panel-2:#171b23; --void:#090b0f; --queued:#343a49; --run:#ff963f; --run-2:#ffcc72;
      --pass:#38d99c; --wait:#b58cff; --fail:#ff6079; --local:#31c8e6; --tart:#ff963f;
      --parallels:#b58cff; color:var(--ink); font-family:ui-monospace,&quot;SFMono-Regular&quot;,Menlo,monospace;
      position:relative; isolation:isolate; overflow:hidden; min-height:760px; padding:22px;
      border:1px solid #242936; border-radius:20px; background:

    #keypath-matrix::before { content:&quot;&quot;; position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:.32; background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size:32px 32px; mask-image:linear-gradient(to bottom,#000,transparent 78%); }
    #keypath-matrix .top { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:18px; }
    #keypath-matrix .eyebrow { display:inline-flex; align-items:center; gap:8px; color:var(--run); font-size:10px; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
    #keypath-matrix .eyebrow::before { content:&quot;✣&quot;; font-size:13px; }

    #keypath-matrix .updated { margin-top:4px; color:var(--faint); font-size:10px; white-space:nowrap; }
    #keypath-matrix .card { border:1px solid var(--line); background:rgba(17,20,26,.86); box-shadow:inset 0 1px rgba(255,255,255,.025); }

    #keypath-matrix .command { display:grid; grid-template-columns:minmax(0,1fr) 136px; gap:12px; margin-bottom:12px; }
    #keypath-matrix .livebar { position:relative; display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:92px; overflow:hidden; padding:16px 18px; border-radius:12px; }
    #keypath-matrix .livebar::after { content:&quot;&quot;; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,var(--run),var(--run-2)); box-shadow:0 0 16px rgba(255,150,63,.65); transform:scaleX(var(--campaign-progress-ratio,0)); transform-origin:left center; transition:transform 420ms cubic-bezier(.23,1,.32,1); }
    #keypath-matrix .live-main { display:flex; align-items:center; gap:13px; min-width:0; }
    #keypath-matrix .live-orbit { position:relative; display:grid; place-items:center; width:42px; height:42px; flex:none; border:1px solid var(--line); border-radius:50%; background:#0c0f14; }
    #keypath-matrix .live-dot { width:10px; height:10px; border-radius:50%; background:var(--faint); }
    #keypath-matrix .live-orbit::before { content:&quot;&quot;; position:absolute; inset:5px; border:1px dashed var(--faint); border-radius:50%; opacity:.45; }
    #keypath-matrix[data-campaign-status=&quot;running&quot;] .live-orbit { border-color:rgba(255,150,63,.55); box-shadow:0 0 28px rgba(255,150,63,.15); }
    #keypath-matrix[data-campaign-status=&quot;running&quot;] .live-orbit::before { border-color:var(--run); animation:matrix-orbit 3s linear infinite; }
    #keypath-matrix[data-campaign-status=&quot;running&quot;] .live-dot { background:var(--run-2); box-shadow:0 0 12px var(--run); animation:matrix-heartbeat 1.5s cubic-bezier(.77,0,.175,1) infinite; }
    #keypath-matrix[data-campaign-status=&quot;passed&quot;] .live-dot { background:var(--pass); box-shadow:0 0 12px rgba(56,217,156,.55); }
    #keypath-matrix[data-campaign-status=&quot;waiting&quot;] .live-dot { background:var(--wait); box-shadow:0 0 12px rgba(181,140,255,.55); animation:matrix-heartbeat 2.4s cubic-bezier(.77,0,.175,1) infinite; }
    #keypath-matrix[data-campaign-status=&quot;failed&quot;] .live-dot,#keypath-matrix[data-campaign-status=&quot;blocked&quot;] .live-dot { background:var(--fail); }
    #keypath-matrix .live-copy { min-width:0; }
    #keypath-matrix .live-copy strong { display:block; overflow:hidden; color:var(--ink); font-family:system-ui,sans-serif; font-size:15px; font-weight:620; text-overflow:ellipsis; white-space:nowrap; }
    #keypath-matrix .live-copy small { display:block; margin-top:5px; overflow:hidden; color:var(--dim); font-family:system-ui,sans-serif; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    #keypath-matrix .live-status { padding:5px 8px; border:1px solid var(--line); border-radius:999px; color:var(--dim); font-size:9px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
    #keypath-matrix[data-campaign-status=&quot;running&quot;] .live-status { border-color:rgba(255,150,63,.5); color:var(--run-2); background:rgba(255,150,63,.08); }
    #keypath-matrix .dial { --dial-progress:0deg; display:grid; place-items:center; min-height:92px; border-radius:12px; }
    #keypath-matrix .dial-ring { display:grid; place-items:center; width:68px; height:68px; border-radius:50%; background:conic-gradient(var(--run) var(--dial-progress),var(--queued) 0); box-shadow:0 0 24px rgba(255,150,63,.09); }
    #keypath-matrix .dial-ring::before { content:&quot;&quot;; grid-area:1/1; width:56px; height:56px; border-radius:50%; background:var(--panel); }
    #keypath-matrix .dial-value { z-index:1; grid-area:1/1; color:var(--ink); font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
    #keypath-matrix .dial-label { margin-top:-2px; color:var(--faint); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }

    #keypath-matrix .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
    #keypath-matrix .metric { position:relative; min-width:0; overflow:hidden; padding:12px 13px; border-radius:9px; }
    #keypath-matrix .metric::before { content:&quot;&quot;; position:absolute; inset:0 auto 0 0; width:2px; background:var(--metric-accent,var(--line)); }
    #keypath-matrix .metric:nth-child(1) { --metric-accent:var(--run); }
    #keypath-matrix .metric:nth-child(2) { --metric-accent:var(--wait); }
    #keypath-matrix .metric:nth-child(3) { --metric-accent:var(--local); }
    #keypath-matrix .metric:nth-child(4) { --metric-accent:var(--pass); }
    #keypath-matrix .metric-label { color:var(--faint); font-size:8px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
    #keypath-matrix .metric-value { display:block; margin-top:4px; color:var(--ink); font-family:system-ui,sans-serif; font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.04em; transform-origin:left center; }
    #keypath-matrix .metric-value.is-changing { animation:matrix-tick 240ms cubic-bezier(.23,1,.32,1); }
    #keypath-matrix .metric-detail { display:block; margin-top:2px; overflow:hidden; color:var(--faint); font-size:9px; text-overflow:ellipsis; white-space:nowrap; }

    #keypath-matrix .matrix { position:relative; overflow:hidden; padding:16px; border-radius:12px; }
    #keypath-matrix .matrix-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:15px; }
    #keypath-matrix .matrix-head strong { display:block; color:var(--ink); font-family:system-ui,sans-serif; font-size:14px; font-weight:620; }

    #keypath-matrix .waves { display:grid; gap:8px; }

    #keypath-matrix .job { --provider:var(--queued); appearance:none; position:relative; min-width:0; min-height:72px; overflow:hidden; padding:9px 10px 10px; border:1px solid var(--line); border-radius:7px; background:#141821; color:var(--dim); cursor:pointer; font:inherit; text-align:left; transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .25s ease,background .25s ease,opacity .25s ease; }
    #keypath-matrix .job[data-provider=&quot;local&quot;] { --provider:var(--local); }
    #keypath-matrix .job[data-provider=&quot;tart&quot;] { --provider:var(--tart); }
    #keypath-matrix .job[data-provider=&quot;parallels&quot;] { --provider:var(--parallels); }

    #keypath-matrix .job[data-status=&quot;running&quot;] { border-color:var(--provider); background:color-mix(in srgb,var(--provider) 12%,#141821); color:var(--ink); box-shadow:0 0 28px color-mix(in srgb,var(--provider) 13%,transparent); }
    #keypath-matrix .job[data-status=&quot;running&quot;]::before { content:&quot;&quot;; position:absolute; top:0; bottom:0; width:38%; background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--provider) 20%,transparent),transparent); transform:translateX(-140%); animation:matrix-scan 2.2s cubic-bezier(.77,0,.175,1) infinite; }

    #keypath-matrix .job[data-status=&quot;waiting&quot;]::before { content:&quot;&quot;; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 22px rgba(181,140,255,.2); opacity:.2; animation:matrix-wait 2.8s cubic-bezier(.77,0,.175,1) infinite; }
    #keypath-matrix .job[data-status=&quot;failed&quot;],#keypath-matrix .job[data-status=&quot;blocked&quot;] { border-color:rgba(255,96,121,.62); background:rgba(255,96,121,.1); color:var(--ink); }
    #keypath-matrix .job::after { content:&quot;&quot;; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--provider); box-shadow:0 0 9px var(--provider); transform:scaleX(var(--job-progress-ratio,0)); transform-origin:left center; transition:transform 360ms cubic-bezier(.23,1,.32,1); }

    #keypath-matrix .job-provider::before { content:&quot;&quot;; width:5px; height:5px; border-radius:50%; background:var(--provider); box-shadow:0 0 8px var(--provider); }

    #keypath-matrix .readout { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr); gap:12px; margin-top:12px; }
    #keypath-matrix .detail,#keypath-matrix .events { min-width:0; padding:14px; border-radius:12px; }
    #keypath-matrix .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    #keypath-matrix .detail-title { color:var(--ink); font-family:system-ui,sans-serif; font-size:14px; font-weight:620; }
    #keypath-matrix .detail-meta { margin-top:4px; color:var(--faint); font-size:8px; }
    #keypath-matrix .badge { padding:4px 7px; border:1px solid var(--line); border-radius:999px; color:var(--dim); font-size:7px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; white-space:nowrap; }
    #keypath-matrix .steps { display:grid; grid-template-columns:repeat(var(--step-count,1),minmax(0,1fr)); gap:4px; margin-top:15px; }
    #keypath-matrix .step { position:relative; min-width:0; min-height:54px; padding:10px 8px 8px; border:1px solid var(--line); border-radius:5px; background:#0d1015; }
    #keypath-matrix .step::before { content:&quot;&quot;; position:absolute; left:8px; right:8px; top:0; height:2px; background:var(--queued); }
    #keypath-matrix .step[data-status=&quot;running&quot;]::before { background:var(--run); box-shadow:0 0 9px var(--run); }
    #keypath-matrix .step[data-status=&quot;passed&quot;]::before { background:var(--pass); }
    #keypath-matrix .step[data-status=&quot;waiting&quot;]::before { background:var(--wait); }

    (() =&gt; {
      const root=document.getElementById(&#x27;keypath-matrix&#x27;);

      const statusLabel={idle:&#x27;Ready&#x27;,queued:&#x27;Queued&#x27;,running:&#x27;Running&#x27;,passed:&#x27;Passed&#x27;,waiting:&#x27;Human wait&#x27;,failed:&#x27;Failed&#x27;,blocked:&#x27;Blocked&#x27;};

      let waveSignature=&#x27;&#x27;;
      let previousSceneIndex=-1;

      let excludedSignature=&#x27;&#x27;;
      const fmtDuration=seconds=&gt;{const value=Math.max(0,Number(seconds)||0);if(value&lt;60)return `${Math.floor(value)}s`;const minutes=Math.floor(value/60),hours=Math.floor(minutes/60);return hours?`${hours}h ${minutes%60}m`:`${minutes}m`;};
      const phaseLabel={transfer:&#x27;Artifact moving to mini&#x27;,provision:&#x27;Mini cloning a fresh VM&#x27;,install:&#x27;Installer entering the guest&#x27;,approval:&#x27;macOS approval gate&#x27;,verify:&#x27;Runtime probes executing&#x27;,evidence:&#x27;Evidence being captured&#x27;,idle:&#x27;Lab settled&#x27;};
